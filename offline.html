<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline timetables · UPTEMPO</title>
<style>:root{color-scheme:dark;--lime:#c2f66b;--line:#33393c}
*{box-sizing:border-box}body{font:15px/1.45 system-ui,sans-serif;background:#101214;color:#f7f8f5;max-width:76rem;margin:auto;padding:clamp(14px,3vw,32px)}
h1{font-size:clamp(24px,5vw,38px);letter-spacing:-.045em;line-height:1.1;margin:10px 0 4px}h3{margin:22px 0 8px}p{color:#bbc2c1;margin:4px 0}
header{border-top:3px solid var(--lime);padding:12px 0 16px}header small,footer{color:#a9b3ad;font-size:12px}footer{margin:16px 0}
.ttScroll{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:12px;background:#131618;margin:10px 0}.ttBoard{display:grid;position:relative;isolation:isolate}
.ttHead,.ttTick{position:sticky;background:#23282a}.ttHead{top:0;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;text-align:center;z-index:3}
.ttTick,.ttClock{grid-column:1;left:0}.ttClock{grid-row:1;z-index:4}.ttTick{font:600 11px/1.4 system-ui;font-variant-numeric:tabular-nums;padding:4px;z-index:2;color:#c7cfcb}
.ttRule{grid-column:2/-1;border-top:1px solid var(--line)}.ttAct{z-index:1;min-width:0;border-left:3px solid #788b79;border-radius:6px;background:#292f31;margin:2px;padding:5px 8px;overflow-wrap:anywhere;line-height:1.22}
.ttAct small,.ttPending small{display:block;color:#bcc7c0;font-size:11px;font-variant-numeric:tabular-nums}.ttAct strong,.ttPending strong{font-size:14px;display:block;margin:3px 0}.ttPending{padding:9px 12px;border-bottom:1px solid var(--line)}
.savedSet{background:#263521;border-left:3px solid var(--lime)}.setMark{font-size:11px;color:var(--lime)}
main button{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:14px;background:#202526;color:inherit;border:1px solid var(--line);border-radius:10px;margin:6px 0}main button::after{content:'›';grid-column:2;grid-row:1/3;align-self:center;color:var(--lime);font-size:23px}main small{color:#b1bbb5;grid-column:1}button,a{touch-action:manipulation}a,#back{background:none;border:0;color:var(--lime);font:inherit;padding:10px 0;display:inline-block}iframe{width:100%;height:84vh;height:84dvh;border:0} [hidden]{display:none!important}
</style><section id="list"><header><small>UPTEMPO</small><h1>Mijn offline timetables</h1></header><main></main><a href="./">Home</a></section>
<section id="reader" hidden><button id="back">‹ Alle downloads</button></section>
<script>
const main=document.querySelector('main');
const list=document.querySelector('#list'),reader=document.querySelector('#reader'),back=document.querySelector('#back');
const copies=Object.values(JSON.parse(localStorage.uptempoOfflineSchedules || '{}'));
let opened;
if (!copies.length) main.textContent='Open online een festival en tik op Download timetable. Je vindt het programma daarna hier.';
for (const copy of copies) {
  const button=document.createElement('button'),name=document.createElement('strong'),meta=document.createElement('small');
  name.textContent=copy.name;meta.textContent=copy.meta;button.append(name,meta);main.append(button);
  button.onclick=()=>{
    opened=button;const frame=document.createElement('iframe');frame.title=copy.name;frame.setAttribute('sandbox','');frame.srcdoc=copy.html;
    reader.append(frame);list.hidden=true;reader.hidden=false;back.focus();window.scrollTo(0,0);
  };
}
back.onclick=()=>{reader.querySelector('iframe')?.remove();reader.hidden=true;list.hidden=false;opened?.focus();};
</script></html>
