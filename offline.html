<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline timetables · UPTEMPO</title>
<style>:root{color-scheme:dark;--lime:#c2f66b;--line:#33393c}
*{box-sizing:border-box}body{font:15px/1.45 system-ui,sans-serif;background:#101214;color:#f7f8f5;max-width:76rem;margin:auto;padding:clamp(14px,3vw,32px)}
h1{font-size:clamp(24px,5vw,38px);letter-spacing:-.045em;line-height:1.1;margin:10px 0 4px}h3{margin:22px 0 8px}p{color:#bbc2c1;margin:4px 0}
header{border-top:3px solid var(--lime);padding:12px 0 16px}header small,footer{color:#a9b3ad;font-size:12px}footer{margin:16px 0}
.ttScroll{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:12px;background:#131618;margin:10px 0}.ttBoard{display:grid;position:relative;isolation:isolate}
.ttHead,.ttTick{position:sticky;background:#23282a}.ttHead{top:0;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;text-align:center;z-index:3}
.ttTick,.ttClock{grid-column:1;left:0}.ttClock{grid-row:1;z-index:4}.ttTick{font:600 11px/1.4 system-ui;font-variant-numeric:tabular-nums;padding:4px;z-index:2;color:#c7cfcb}
.ttRule{grid-column:2/-1;border-top:1px solid var(--line)}.ttAct{z-index:1;min-width:0;border-left:3px solid #788b79;border-radius:6px;background:#292f31;margin:2px;padding:5px 8px;overflow-wrap:anywhere;line-height:1.22}
.ttAct small,.ttPending small{display:block;color:#bcc7c0;font-size:11px;font-variant-numeric:tabular-nums}.ttAct strong,.ttPending strong{font-size:14px;display:block;margin:3px 0}.ttPending{padding:9px 12px;border-bottom:1px solid var(--line)}
.savedSet{background:#263521;border-left:3px solid var(--lime)}.setMark{font-size:11px;color:var(--lime)}
main button{font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:14px;background:#202526;color:inherit;border:1px solid var(--line);border-radius:10px;margin:6px 0}main button::after{content:'›';grid-column:2;grid-row:1/3;align-self:center;color:var(--lime);font-size:23px}main small{color:#b1bbb5;grid-column:1}button,a{touch-action:manipulation}a,#back{background:none;border:0;color:var(--lime);font:inherit;padding:10px 0;display:inline-block}iframe{width:100%;height:84vh;height:84dvh;border:0} [hidden]{display:none!important}
#shot{float:right;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#253022;color:#d6f3a1;font:inherit}#poster{position:fixed;inset:0;width:100%;height:100%;z-index:5;border:0;background:#121618;padding:env(safe-area-inset-top,0px) 4px env(safe-area-inset-bottom,0px);display:grid;place-items:center}#poster img{width:100%;height:100%;min-height:0;object-fit:contain}
</style><section id="list"><header><small>UPTEMPO</small><h1>Mijn timetables</h1></header><main></main><a href="./">Home</a></section>
<section id="reader" hidden><button id="back">‹ Mijn timetables</button><button id="shot">Screenshotweergave</button></section>
<button id="poster" hidden aria-label="Sluit screenshotweergave"><img alt="Volledige offline timetable"></button>
<script>
const main=document.querySelector('main');
const list=document.querySelector('#list'),reader=document.querySelector('#reader'),back=document.querySelector('#back');
const copies=Object.values(JSON.parse(localStorage.uptempoOfflineSchedules || '{}'));
let opened;
if (!copies.length) main.textContent='Open online een festival en tik op Bewaar offline. Je vindt het programma daarna hier.';
for (const copy of copies) {
  const button=document.createElement('button'),name=document.createElement('strong'),meta=document.createElement('small');
  name.textContent=copy.name;meta.textContent=copy.meta;button.append(name,meta);main.append(button);
  button.onclick=()=>{
    currentCopy=copy;opened=button;const frame=document.createElement('iframe');frame.title=copy.name;frame.setAttribute('sandbox','');frame.srcdoc=copy.html;
    reader.append(frame);list.hidden=true;reader.hidden=false;back.focus();window.scrollTo(0,0);
  };
}
back.onclick=()=>{reader.querySelector('iframe')?.remove();reader.hidden=true;list.hidden=false;opened?.focus();};
const shot = document.querySelector('#shot');
const poster = document.querySelector('#poster');
let currentCopy;
let posterUrl;
function closePoster() {
  poster.hidden = true;
  poster.querySelector('img').removeAttribute('src');
  if (posterUrl) URL.revokeObjectURL(posterUrl);
  posterUrl = null;
  shot.focus();
}
poster.onclick = closePoster;
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !poster.hidden) closePoster();
});
function posterGroups(copy) {
  const doc = new DOMParser().parseFromString(copy.html, 'text/html');
  const groups = new Map();
  const add = (group, card, time) => {
    const artist = card.querySelector('strong,span')?.textContent || '';
    const favorite = card.classList.contains('savedSet') || card.textContent.includes('★ Favoriet');
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push({artist:(favorite ? '★ ' : '') + artist,time,favorite});
  };
  for (const board of doc.querySelectorAll('.ttBoard')) {
    const prev = board.parentElement.previousElementSibling;
    const day = prev?.tagName === 'H3' ? prev.textContent : '';
    const stages = [...board.querySelectorAll('.ttHead:not(.ttClock)')];
    for (const card of board.querySelectorAll('.ttAct')) {
      const col = parseInt(card.style.gridColumn);
      const stage = stages.filter(head => parseInt(head.style.gridColumn) <= col).pop()?.textContent;
      add([day,stage].filter(Boolean).join(' · ') || 'Programma', card,card.querySelector('small')?.textContent || '');
    }
  }
  for (const card of doc.querySelectorAll('.ttPending')) {
    add([card.querySelector('small')?.textContent,'Speeltijd volgt'].filter(Boolean).join(' · '),card,'');
  }
  return groups;
}
function drawPoster(copy) {
  const groups = posterGroups(copy);
  const ctx = document.createElement('canvas').getContext('2d');
  const width = 330;
  const wrap = (value,size,weight,max) => {
    ctx.font = weight+' '+size+'px system-ui';
    const lines = [];
    let line = '';
    for (const word of value.split(/\s+/)) {
      if (line && ctx.measureText(line+' '+word).width > max) { lines.push(line); line=''; }
      for (const ch of (line?' ':'')+word) {
        if (line && ctx.measureText(line+ch).width>max) {lines.push(line);line='';}
        line+=ch;
      }
    }
    if (line) lines.push(line);
    return lines;
  };
  const sections = [...groups].map(([label,sets]) => {
    const rows=[];
    const append=(s,size,weight,color)=>{for(const line of wrap(s,size,weight,width-26)) rows.push({line,size,weight,color});};
    append(label,16,700,'#c2f66b');
    for (const set of sets) {
      if(set.time) append(set.time,13,600,'#bdc8c2');
      append(set.artist,17,700,set.favorite?'#c2f66b':'#ffffff');
      rows.push({gap:5});
    }
    return rows;
  });
  const vw=poster.clientWidth||innerWidth,vh=poster.clientHeight||innerHeight;
  const entries=sections.reduce((n,s)=>n+s.length,0);
  let best;
  // Keep each stage together and pick the layout with the largest readable text.
  for(let count=1;count<=Math.min(10,Math.max(1,entries));count++){
    const columns=Array.from({length:count},()=>[]);
    const heights=columns.map(()=>0);
    const totalWidth=width*count+24;
    const title=wrap(copy.name,25,750,totalWidth-32);
    const meta=wrap(copy.meta||'',15,500,totalWidth-32);
    const top=22+title.length*30+meta.length*20+12;
    const rowHeight = row => row.gap || row.size+3;
    const ideal = Math.ceil(sections.flat().reduce((n,row)=>n+rowHeight(row),0)/count);
    for(const section of sections) {
      const heading=section.filter(row=>row.size===16);
      const blocks=[];
      let block=[];
      for(const row of section.slice(heading.length)) {
        block.push(row);
        if(row.gap){blocks.push(block);block=[];}
      }
      if(block.length)blocks.push(block);
      let col=heights.indexOf(Math.min(...heights));
      let needsTitle=true;
      for(const rows of blocks){
        const size=rows.reduce((n,row)=>n+rowHeight(row),0);
        const next=heights.indexOf(Math.min(...heights));
        if(!needsTitle && col!==next && heights[col]+size>ideal && heights[next]+40<heights[col]) {
          col=next;needsTitle=true;
        }
        if(needsTitle){columns[col].push(...heading);heights[col]+=heading.reduce((n,row)=>n+rowHeight(row),0);needsTitle=false;}
        columns[col].push(...rows);heights[col]+=size;
      }
      columns[col].push({gap:13});heights[col]+=13;
    }
    const height=top+Math.max(...heights)+12;
    const score=Math.min(vw/totalWidth,vh/height);
    if(!best||score>best.score)best={score,totalWidth,height,columns,top,title,meta};

  }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+best.totalWidth+' '+best.height);
  const node=(tag,attrs,content)=>{const el=document.createElementNS(svg.namespaceURI,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(content)el.textContent=content;svg.append(el);};
  node('rect',{width:'100%',height:'100%',fill:'#121618'});
  const write=(line,x,y,size,weight,color)=>node('text',{x,y,'font-family':'system-ui,sans-serif','font-size':size,'font-weight':weight,fill:color},line);
  let y=12;
  for(const line of best.title){y+=30;write(line,16,y,25,750,'#fff');}
  for(const line of best.meta){y+=20;write(line,16,y,15,500,'#bdc8c2');}
  best.columns.forEach((rows,i)=>{let y=best.top;for(const row of rows){y+=row.gap||row.size+3;if(!row.gap)write(row.line,16+i*width,y,row.size,row.weight,row.color);}});
  return URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));
}
shot.onclick=()=>{
  poster.hidden=false;
  posterUrl=drawPoster(currentCopy);
  poster.querySelector('img').src=posterUrl;
  poster.focus();
};

</script></html>
