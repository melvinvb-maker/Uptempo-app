name: Grant festival editor access
on:
  workflow_dispatch:
    inputs:
      uid:
        description: Verified owner account UID (friend code)
        required: true
permissions:
  contents: read
jobs:
  grant:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts --ignore-scripts --no-audit --no-fund
      - run: |
          node <<'NODE'
          const admin = require('./scripts/node_modules/firebase-admin');
          (async () => {
            const key = JSON.parse(process.env.SERVICE_ACCOUNT);
            if (key.project_id !== 'uptempo-43116') throw Error('Project mismatch');
            admin.initializeApp({credential:admin.credential.cert(key)});
            const user = await admin.auth().getUser(process.env.OWNER_UID.trim());
            if (!user.providerData.some(p => p.providerId === 'password')) throw Error('Password account required');
            await admin.auth().setCustomUserClaims(user.uid,{...user.customClaims,uptempoOwner:true});
          })().catch(e=>{console.error(e.code || e.message);process.exitCode=1});
          NODE
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          OWNER_UID: ${{ inputs.uid }}
