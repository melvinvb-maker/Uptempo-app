name: Import festival timetable

on:
  schedule:
    - cron: "15 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptempo-festival-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCOUNTS_JSON: ${{ secrets.INSTAGRAM_ACCOUNTS_JSON }}
      FIREBASE_PROJECT_ID: uptempo-43116
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install importer
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Import new festival timetable posts
        working-directory: scripts
        run: npm run import
