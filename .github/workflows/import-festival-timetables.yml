name: Import festival timetable

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-festival-timetables.yml"
      - "scripts/**"
      - "confused-editions.mjs"

permissions:
  contents: write

concurrency:
  group: uptempo-festival-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCOUNTS_JSON: ${{ secrets.INSTAGRAM_ACCOUNTS_JSON }}
      FIREBASE_PROJECT_ID: uptempo-43116
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install importer
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Install Chromium for dynamic festival pages
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Import new festival timetable posts
        working-directory: scripts
        run: npm run import

      - name: Collect photos for artists without one
        working-directory: scripts
        continue-on-error: true
        run: npm run photos

      - name: Save new artist photos
        run: |
          git add images/acts/auto auto-photos.js
          if git diff --cached --quiet; then
            echo "No new artist photos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add automatically collected artist photos"
            # main may have moved on while the import ran: put the photos on top of it.
            git pull --rebase origin main
            git push
          fi
