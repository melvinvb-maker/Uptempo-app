name: Configure UPTEMPO accounts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['social/configure.cjs','social/social.rules','.github/workflows/accounts.yml']
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts --ignore-scripts --no-audit --no-fund
      - run: node social/configure.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
